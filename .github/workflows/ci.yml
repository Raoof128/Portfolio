name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guarded dependency regression tests
        run: npm run test:dependency-security

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Machine-schema regression tests
        run: npm run test:schemas

      - name: HTTP audit regression tests
        run: npm run test:audit-http

      - name: Static security regression tests
        run: npm run test:security

      - name: Build
        run: npm run build

      - name: Static artifact security audit
        run: npm run audit:security

      - name: Agent / machine-reliability audit
        run: npm run audit:agents

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
